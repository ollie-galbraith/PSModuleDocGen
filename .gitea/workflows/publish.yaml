name: Publish PSModuleDocGen Powershell Module

variables:
  MODULE_MANIFEST: PSModuleDocGen.psd1

on:
  push:
    branches:
      - main
    paths:
      - ${{ variables.MODULE_MANIFEST }}
      - '.gitea/workflows/publish.yaml'
  pull_request:
    branches:
      - main
    paths:
      - ${{ variables.MODULE_MANIFEST }}
      - '.gitea/workflows/publish.yaml'

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ${{ secrets.CONTAINER_REGISTRY }}/pwsh:latest
      credentials:
        username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Publish PSModuleDocGen Module
        shell: pwsh
        run: |
          $PathsToRemove = @(
              './docs',
              './.gitea',
              './.github',
              './.vscode',
              './.git',
              './README.md'
          )
          Foreach ($Path in $PathsToRemove)
              {
                  Remove-Item -Path $Path -Recurse -Force -ErrorAction SilentlyContinue
              }

          $RequiredModules = Import-PowerShellDataFile -Path ${{ variables.MODULE_MANIFEST }}
          ForEach ($Module in $RequiredModules.RequiredModules)
              {
                  Install-Module -Name $Module -Force -AllowClobber
              }

          Publish-PSResource -Path ./ -Repository 'PSGallery' -ApiKey ${{ secrets.PSGALLERY_API_KEY }}